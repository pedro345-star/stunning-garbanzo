<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Fácil - Apps & Jogos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1f1f1f;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2em;
    }
    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background-color: #222;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    .card img {
      width: 100%;
      border-radius: 4px;
    }
    .card h2 {
      margin: 10px 0 5px;
      font-size: 1.2em;
    }
    .card p {
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    .card a {
      display: inline-block;
      padding: 10px 15px;
      background-color: #3a86ff;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .card a:hover {
      background-color: #2a68d8;
    }
  </style>
</head>
<body>
  <header>
    <h1>Download Fácil</h1>
    <p>Encontre os melhores apps e jogos para baixar rapidamente!</p>
  </header>
  <main class="container">
    <div class="card">
      <img src="https://via.placeholder.com/300x150" alt="Imagem do App ou Jogo" />
      <h2>Jogo Exemplo</h2>
      <p>Um jogo incrível de aventura. Tamanho: 150MB. Requer Android 7.0+</p>
      <a href="#">Baixar</a>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x150" alt="Imagem do App ou Jogo" />
      <h2>App Utilitário</h2>
      <p>Ferramenta útil para o dia a dia. Versão: 1.2. Tamanho: 10MB.</p>
      <a href="#">Baixar</a>
    </div>
  </main>
</body>
  </html>
